<!DOCTYPE html>
<html lang="en" data-phrases="../phrases.en.md" data-load-error="Could not load the phrase list">
<head>
  <meta charset="utf-8" />
  <title>Random phrase</title>
  <meta name="description" content="A random phrase on every press: hit the button and get one of hundreds of phrases." />
  <link rel="canonical" href="https://hirundos-dev.github.io/random-quote/en/" />
  <link rel="alternate" hreflang="ru" href="https://hirundos-dev.github.io/random-quote/" />
  <link rel="alternate" hreflang="en" href="https://hirundos-dev.github.io/random-quote/en/" />
  <link rel="alternate" hreflang="x-default" href="https://hirundos-dev.github.io/random-quote/" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- A literal, not a token: a meta cannot read a CSS variable. Duplicates
       --ids__background; script.js overwrites it from the computed value once
       the stylesheets are up, so the palette stays the source of truth. -->
  <meta name="theme-color" content="#ffffff" />
  <script>
    /* The theme is applied here in <head>, before the first paint, or a dark
       page flashes white. The rule is resolveTheme() in script.js; this is its
       one-line duplicate: a stored choice beats the system setting. */
    (function () {
      var stored;

      try {
        stored = localStorage.getItem('ids-theme');
      } catch (error) {
        stored = null;
      }

      if (stored !== 'dark' && stored !== 'light') {
        stored = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      document.documentElement.classList.toggle('dark', stored === 'dark');
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute('content', stored === 'dark' ? '#121214' : '#ffffff');
    })();
  </script>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Random phrase" />
  <meta property="og:title" content="Random phrase" />
  <meta property="og:description" content="A random phrase on every press: hit the button and get one of hundreds of phrases." />
  <meta property="og:url" content="https://hirundos-dev.github.io/random-quote/en/" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" href="../css/tokens/palette.css" />
  <link rel="stylesheet" href="../css/tokens/colors.css" />
  <link rel="stylesheet" href="../css/tokens/scales.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/settings.css" />
  <link rel="stylesheet" href="../css/page-composition/layout.css" />
  <link rel="stylesheet" href="../css/serega-gentle.css" />
  <link rel="stylesheet" href="../css/project.css" />
</head>
<body class="ids">
  <header class="ids__chrome">
    <nav class="ids__lang" aria-label="Language">
      <a href="../" hreflang="ru" lang="ru">RU</a>
      <span lang="en" aria-current="page">EN</span>
    </nav>
    <button id="theme-toggle" class="ids__theme-toggle" type="button" aria-pressed="false">Dark theme</button>
  </header>
  <main>
    <div class="ids__wrapper">
      <div class="ids__text-width">
        <h1 class="ids__visually-hidden">Random phrase</h1>
        <blockquote id="quote"></blockquote>
      </div>
      <button id="show-quote" class="ids__shine">Show a phrase</button>
    </div>
  </main>
  <script type="module" src="../script.js"></script>
</body>
</html>
