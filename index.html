<!DOCTYPE html>
<html lang="ru" data-phrases="phrases.md" data-load-error="Не удалось загрузить список фраз">
<head>
  <meta charset="utf-8" />
  <title>Случайная фраза</title>
  <meta name="description" content="Случайная фраза на каждое нажатие: нажмите кнопку — и получите одну из сотен фраз." />
  <link rel="canonical" href="https://hirundos-dev.github.io/random-quote/" />
  <link rel="alternate" hreflang="ru" href="https://hirundos-dev.github.io/random-quote/" />
  <link rel="alternate" hreflang="en" href="https://hirundos-dev.github.io/random-quote/en/" />
  <link rel="alternate" hreflang="x-default" href="https://hirundos-dev.github.io/random-quote/" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Литерал, а не токен: содержимое meta не умеет читать CSS-переменные.
       Дублирует --ids__background; после загрузки script.js перезаписывает
       его вычисленным значением, так что палитра остаётся источником правды. -->
  <meta name="theme-color" content="#ffffff" />
  <script>
    /* Тема применяется в <head>, до первой отрисовки, иначе тёмная страница
       моргает белой. Правило выбора — resolveTheme в script.js, здесь его
       однострочный дубль: записанный выбор побеждает системную настройку. */
    (function () {
      var stored;

      try {
        stored = localStorage.getItem('ids-theme');
      } catch (error) {
        stored = null;
      }

      if (stored !== 'dark' && stored !== 'light') {
        stored = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      document.documentElement.classList.toggle('dark', stored === 'dark');
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute('content', stored === 'dark' ? '#121214' : '#ffffff');
    })();
  </script>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Случайная фраза" />
  <meta property="og:title" content="Случайная фраза" />
  <meta property="og:description" content="Случайная фраза на каждое нажатие: нажмите кнопку — и получите одну из сотен фраз." />
  <meta property="og:url" content="https://hirundos-dev.github.io/random-quote/" />
  <meta property="og:locale" content="ru_RU" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" href="css/tokens/palette.css" />
  <link rel="stylesheet" href="css/tokens/colors.css" />
  <link rel="stylesheet" href="css/tokens/scales.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/page-composition/layout.css" />
  <link rel="stylesheet" href="css/serega-gentle.css" />
  <link rel="stylesheet" href="css/project.css" />
</head>
<body class="ids">
  <header class="ids__chrome">
    <nav class="ids__lang" aria-label="Язык">
      <span lang="ru" aria-current="page">RU</span>
      <a href="en/" hreflang="en" lang="en">EN</a>
    </nav>
    <button id="theme-toggle" class="ids__theme-toggle" type="button" aria-pressed="false">Тёмная тема</button>
  </header>
  <main>
    <div class="ids__wrapper">
      <div class="ids__text-width">
        <h1 class="ids__visually-hidden">Случайная фраза</h1>
        <blockquote id="quote"></blockquote>
      </div>
      <button id="show-quote" class="ids__shine">Показать фразу</button>
    </div>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
